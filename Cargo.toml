[workspace]
members = ["crates/psmc-core", "crates/psmc-io", "crates/psmc-cli", "crates/psmc-cpu", "crates/psmc-cuda"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
publish = false

[profile.release]
opt-level = 2
debug = 1
lto = false
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
